services:
  mysql:
    # 9.7 LTS (9.6, Innovation, lost support in April 2026).
    image: mysql:9.7
    container_name: statscollector-mysql
    restart: unless-stopped
    command:
      - "mysqld"
      - "--pid-file=/var/lib/mysql/mysql.pid"
      - "--innodb-buffer-pool-size=1G"
      - "--innodb-redo-log-capacity=512M"
      - "--max-connections=${MYSQL_MAX_CONNECTIONS:-100}"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--container-aware=ON"
      - "--local-infile=ON"
    environment:
      MYSQL_DATABASE: cs2_statscollector
      MYSQL_USER: cs2_statscollector
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # Root logs in from inside the container only (the image's default is root@'%').
      MYSQL_ROOT_HOST: localhost
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
      TZ: UTC
    secrets:
      - mysql_root_password
      - mysql_user_password
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary init server (which runs init.sql) answers on the socket only.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: statscollector-phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    # Shows a login form: with PMA_USER set it would log anyone who reaches the port in automatically.
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mysql_data:
    driver: local

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_user_password:
    file: ./secrets/mysql_user_password.txt
